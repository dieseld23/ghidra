name: build

# Builds Ghidra's native decompiler on Linux + Windows so you can grab a drop-in
# binary without a local C++ setup. Uses the repo's Gradle wrapper (./gradlew) so
# the Gradle version always matches what this Ghidra tree expects.
on:
  push:
    branches: ["**"]        # any branch push (e.g. fold-zext-spacebase)
  workflow_dispatch:         # manual "Run workflow" button in the Actions tab

jobs:
  natives:
    name: Build decompiler (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash                          # so ./gradlew works on Windows (git-bash) too
    strategy:
      fail-fast: false                       # one OS failing must not cancel the other
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 25                   # JDK version per Ghidra/application.properties
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"

      - name: Set up Gradle                   # dependency caching; the Gradle version comes from ./gradlew
        uses: gradle/actions/setup-gradle@v4

      # Linux needs g++/make; Windows uses MSVC (auto-discovered from VS 2022 on the runner).
      # No bison/flex on either: the generated parser .cc files are checked into source
      # control (generateParsers is a separate manual task), so buildNatives just compiles.
      - name: Install Linux native toolchain
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y g++ make

      - name: Fetch non-Maven dependencies    # creates dependencies/flatRepo the build requires
        run: ./gradlew -I gradle/support/fetchDependencies.gradle

      - name: Build native components (compiles the decompiler)
        run: ./gradlew buildNatives
        env:
          LC_MESSAGES: en_US.UTF-8            # DevGuide: native-toolchain discovery on some locales

      - name: Locate built decompiler
        run: find . -path '*/os/*' -type f -name 'decompile*' -printf '%p  (%s bytes)\n' || true

      - name: Upload decompiler
        uses: actions/upload-artifact@v4
        with:
          name: decompiler-${{ runner.os }}   # decompiler-Linux / decompiler-Windows
          if-no-files-found: warn
          path: |
            Ghidra/Features/Decompiler/build/os/**/decompile*
            Ghidra/Features/Decompiler/os/**/decompile*

  # ---------------------------------------------------------------------------
  # Full runnable Ghidra distribution (Linux). Slower (~20-30 min). Uncomment to
  # get a build/dist zip containing your patched decompiler + the C28x module.
