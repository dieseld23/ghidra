name: build

# Builds Ghidra's native decompiler on Linux + Windows so you can grab a drop-in
# binary without a local C++ setup. Versions come from Ghidra/application.properties
# (this tree = 12.2 DEV): application.java.min=25, application.gradle.min=9.1
on:
  push:
    branches: ["**"]        # any branch push (e.g. fold-zext-spacebase)
  workflow_dispatch:         # manual "Run workflow" button in the Actions tab

jobs:
  natives:
    name: Build decompiler (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false                       # one OS failing must not cancel the other
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"

      - name: Set up Gradle                   # puts Gradle 9.5.1 on PATH (Ghidra needs it there, >= 9.1)
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.5.1"

      # Linux needs g++/make; Windows uses MSVC (auto-discovered from VS 2022 on the runner).
      # No bison/flex on either: the generated parser .cc files are checked into source control.
      - name: Install Linux native toolchain
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y g++ make

      - name: Fetch non-Maven dependencies    # creates dependencies/flatRepo the build requires
        run: gradle -I gradle/support/fetchDependencies.gradle

      - name: Build native components (compiles the decompiler)
        # --rerun-tasks + --no-build-cache: never reuse a cached/up-to-date native binary, so a
        # ruleaction.cc change always recompiles decompile.exe (otherwise the gradle cache from
        # setup-gradle can hand back the previous build).
        run: gradle buildNatives --rerun-tasks --no-build-cache
        env:
          LC_MESSAGES: en_US.UTF-8            # DevGuide: native-toolchain discovery on some locales

      - name: Locate built decompiler
        shell: bash                            # so 'find' is GNU find on Windows too (git-bash)
        run: |
          find . -path '*/os/*' -type f -name 'decompile*' -printf '%p  (%s bytes)\n' || true
          echo "--- sha256 (compare across runs to confirm the binary actually changed) ---"
          find . -path '*/os/*' -type f -name 'decompile*' -exec sha256sum {} \; || true

      - name: Upload decompiler
        uses: actions/upload-artifact@v4
        with:
          name: decompiler-${{ runner.os }}   # decompiler-Linux / decompiler-Windows
          if-no-files-found: warn
          path: |
            Ghidra/Features/Decompiler/build/os/**/decompile*
            Ghidra/Features/Decompiler/os/**/decompile*

  # ---------------------------------------------------------------------------
  # Full runnable Ghidra distribution (Linux). Slower (~20-30 min). Uncomment to
  # get a build/dist zip containing your patched decompiler + the C28x module.
