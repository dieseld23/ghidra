name: build

# Builds Ghidra's native components (incl. the decompiler) on a Linux runner,
# so you can compile/test the decompiler change without a local Windows C++ setup.
# Versions come from Ghidra/application.properties (this tree = 12.2 DEV):
#   application.java.min=25   application.gradle.min=9.1
on:
  push:
    branches: ["**"]        # any branch push (e.g. fold-zext-spacebase)
  workflow_dispatch:         # manual "Run workflow" button in the Actions tab

jobs:
  natives:
    name: Build native decompiler
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.5.1"    # must be >= application.gradle.min (9.1)

      - name: Install native toolchain
        run: sudo apt-get update && sudo apt-get install -y bison flex g++ make

      - name: Fetch non-Maven dependencies
        run: gradle -I gradle/support/fetchDependencies.gradle

      - name: Build native components (compiles the decompiler)
        run: gradle buildNatives
        env:
          LC_MESSAGES: en_US.UTF-8    # DevGuide: needed for native-toolchain discovery on some locales

      - name: Upload decompiler binary
        uses: actions/upload-artifact@v4
        with:
          name: decompiler-linux
          path: Ghidra/Features/Decompiler/os/**/decompile*

  # ---------------------------------------------------------------------------
  # Full runnable Ghidra distribution (Linux). Slower (~20-30 min). Uncomment to
  # get a build/dist zip containing your patched decompiler + the C28x module.
